apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vllm-healthy
spec:
  description: vLLM ArgoCD app is Synced/Healthy, pod running on whale, OpenAI API responds
  concurrent: false
  timeouts:
    assert: 15m
    exec: 3m

  steps:

  - name: argocd-app-synced-and-healthy
    description: ArgoCD Application is Synced and Healthy
    try:
    - assert:
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: vllm
            namespace: argocd
          status:
            sync:
              status: Synced
            health:
              status: Healthy

  - name: serving-pod-running-on-whale
    description: vLLM serving-engine pod is Running and scheduled on whale
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            namespace: vllm
            labels:
              app.kubernetes.io/component: serving-engine
          spec:
            nodeName: whale
          status:
            phase: Running

  - name: vllm-health-endpoint
    description: vLLM /health endpoint returns 200 via engine service ClusterIP
    try:
    - script:
        content: |
          SVC=$(kubectl get svc vllm-qwen25-7b-engine-service -n vllm -o jsonpath='{.spec.clusterIP}')
          curl -sf http://$SVC/health
          echo "Health check passed"

  - name: vllm-models-endpoint
    description: vLLM /v1/models lists the deployed model
    try:
    - script:
        content: |
          SVC=$(kubectl get svc vllm-qwen25-7b-engine-service -n vllm -o jsonpath='{.spec.clusterIP}')
          RESPONSE=$(curl -sf http://$SVC/v1/models)
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"object":"list"' || { echo "Unexpected /v1/models response"; exit 1; }
          echo "Models endpoint OK"

  - name: vllm-openai-chat-completion
    description: OpenAI-compatible chat completion returns correct, complete, non-degenerate output
    try:
    - script:
        content: |
          SVC=$(kubectl get svc vllm-qwen25-7b-engine-service -n vllm -o jsonpath='{.spec.clusterIP}')
          RESPONSE=$(curl -sf http://$SVC/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model": "Qwen/Qwen2.5-7B-Instruct-AWQ",
              "messages": [{"role": "user", "content": "Reply with exactly one word: OK"}],
              "max_tokens": 10,
              "temperature": 0
            }')
          echo "$RESPONSE"
          echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          choice = data['choices'][0]
          content = choice['message']['content']
          finish_reason = choice['finish_reason']
          prompt_tokens = data['usage']['prompt_tokens']
          completion_tokens = data['usage']['completion_tokens']

          assert content.strip(), 'content is empty'
          assert 'ok' in content.strip().lower(), f'unexpected content: {content!r}'
          assert finish_reason == 'stop', f'unexpected finish_reason: {finish_reason!r}'
          assert prompt_tokens > 0, f'prompt_tokens not > 0: {prompt_tokens}'
          assert completion_tokens > 0, f'completion_tokens not > 0: {completion_tokens}'
          print(f'Chat completion OK: content={content!r} finish_reason={finish_reason} prompt_tokens={prompt_tokens} completion_tokens={completion_tokens}')
          "
