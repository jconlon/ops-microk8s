# Intel GPU device plugin (issue #122). Advertises the gpu.intel.com/i915
# resource to kubelet for nodes with an Intel iGPU, and correctly wires the
# cgroup device rule for consumer pods that request it -- something a plain
# hostPath device mount cannot do (bind-mounting a device node does not add
# it to the container's cgroup device allow-list, so open() on the device
# fails with EPERM even when file permissions look correct; confirmed the
# hard way when QSV transcoding never actually worked despite whale's
# renderD129 being mounted directly into Jellyfin).
#
# Talks to kubelet over its local Unix socket (/var/lib/kubelet/device-plugins),
# not the Kubernetes API -- no RBAC needed.
#
# nodeSelector restricted to whale: upstream's base manifest targets every
# amd64 node, but whale is the cluster's only node with an Intel iGPU
# (RTX 2000 Ada on whale is NVIDIA, already handled by the separate
# nvidia.com/gpu device plugin via gpu-operator).
#
# Source: https://github.com/intel/intel-device-plugins-for-kubernetes/blob/v0.36.0/deployments/gpu_plugin/base/intel-gpu-plugin.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-gpu-plugin
  labels:
    app: intel-gpu-plugin
spec:
  selector:
    matchLabels:
      app: intel-gpu-plugin
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: intel-gpu-plugin
    spec:
      nodeSelector:
        kubernetes.io/hostname: whale
      containers:
        - name: intel-gpu-plugin
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          image: intel/intel-gpu-plugin:0.36.0
          imagePullPolicy: IfNotPresent
          securityContext:
            seLinuxOptions:
              type: "container_device_plugin_t"
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: "45Mi"
              cpu: 40m
            limits:
              memory: "90Mi"
              cpu: 100m
          volumeMounts:
            - name: devfs
              mountPath: /dev/dri
              readOnly: true
            - name: sysfsdrm
              mountPath: /sys/class/drm
              readOnly: true
            - name: kubeletsockets
              mountPath: /var/lib/kubelet/device-plugins
            - name: cdipath
              mountPath: /var/run/cdi
      volumes:
        - name: devfs
          hostPath:
            path: /dev/dri
        - name: sysfsdrm
          hostPath:
            path: /sys/class/drm
        - name: kubeletsockets
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: cdipath
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
