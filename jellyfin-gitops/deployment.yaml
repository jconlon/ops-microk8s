apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/component: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
        app.kubernetes.io/component: app
    spec:
      # Pinned to whale (issue #116): mullet was at 79% memory/swap-maxed at
      # grilling time; whale had headroom and is the cluster's only GPU node,
      # keeping the door open for hardware transcoding later.
      nodeSelector:
        kubernetes.io/hostname: whale
      enableServiceLinks: false
      # Issue #122: GIDs for whale's render/video device groups, needed so the
      # container user can open /dev/dri/renderD129 without running as root.
      # Verified 2026-07-30 (still render=110, video=44, matching the issue's
      # 2026-07-26 finding) -- re-check after any OS upgrade on whale.
      securityContext:
        supplementalGroups: [110, 44]
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:latest
          ports:
            - containerPort: 8096
              name: http
          # Explicit guardrail (issue #116): whale is also a control-plane
          # node, so a runaway software transcode shouldn't threaten cluster
          # stability.
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
            # Issue #122: Intel UHD 770 iGPU render node for QuickSync (QSV)
            # hardware transcoding. Mounts only this specific device node, not
            # all of /dev/dri -- whale's other node (renderD128/card1) is the
            # NVIDIA RTX 2000 Ada, already exclusively managed by the
            # nvidia.com/gpu device plugin for vLLM; exposing it here via raw
            # hostPath would bypass that scheduling.
            - name: intel-qsv
              mountPath: /dev/dri/renderD129
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          persistentVolumeClaim:
            claimName: jellyfin-media
        - name: intel-qsv
          hostPath:
            path: /dev/dri/renderD129
            type: CharDevice
