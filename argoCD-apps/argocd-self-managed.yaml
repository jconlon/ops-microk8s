apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers: [] # Explicitly empty
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.3.3
    helm:
      values: |
        global:
          domain: argocd.verticon.com

        configs:
          params:
            # This is the key setting for gRPC-Web default behavior
            server.grpc.web: true
            server.insecure: true

        server:
          insecure: true
          ingress:
            enabled: false
          service:
            type: LoadBalancer

        notifications:
          enabled: false
        dex:
          enabled: false
        redis-ha:
          enabled: false
        redis:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
